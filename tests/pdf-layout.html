<!doctype html><html lang="es"><meta charset="utf-8"><title>Prueba visual del rótulo CIMAGRAF</title>
<link rel="stylesheet" href="../report-summary.css?v=5.1.0"><link rel="stylesheet" href="../labels.css?v=5.1.0">
<style>body{font:14px Arial;background:#e6e9ec;margin:20px}button{padding:10px;margin-right:8px}#source{background:white;width:186mm;margin:15px auto}#app{position:absolute;left:-10000px;width:1200px;height:800px}#result{width:100%;height:850px;border:0}#state{padding:12px;background:white}</style>
<h1>Prueba visual con datos ficticios</h1><p>No inicia sesión ni escribe en Microsoft. PDF y rótulo comparten HTML y estilos.</p>
<button id="render" disabled>Generar PDF</button><button id="many" disabled>Probar 3 páginas</button><p id="state">Cargando…</p><a id="download" hidden download="cimagraf-prueba.pdf">Descargar PDF</a><iframe id="result" title="PDF generado" hidden></iframe><div id="source"></div><iframe id="app" title="Calculadora aislada"></iframe>
<script src="test-frame.js?v=5.1.0"></script><script src="../report-pdf.js?v=5.1.0"></script><script>
const app=document.getElementById('app'),state=document.getElementById('state');let r,url;
app.onload=()=>{if(!app.contentWindow.CimagrafArchive)return;CimagrafTestFrame.seed(app);queueMicrotask(()=>{r=app.contentWindow.CimagrafArchive.snapshot().result;document.getElementById('render').disabled=!r;document.getElementById('many').disabled=!r;state.textContent=r?'Rótulo listo para generar.':'Error al calcular.';});};
async function generate(many){try{
 state.textContent='Generando PDF…';const data=JSON.parse(JSON.stringify(r));
 if(many){const first=data.usedRolls[0];data.usedRolls=Array.from({length:3},(_,i)=>({...first,id:'Bobina '+(i+1),lot:'000123-'+(i+1)}));data.details=data.usedRolls.map(b=>({...data.details[0],bobina:b.id}));}
 const html=app.contentWindow.CimagrafArchive.reportHTML(data,'2026-11-25T14:30:00Z');document.getElementById('source').innerHTML='<section class="cimagraf-report">'+html+'</section>';
 const bytes=await CimagrafReportPDF.render(html);if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));
 const frame=document.getElementById('result');frame.src=url;frame.hidden=false;const a=document.getElementById('download');a.href=url;a.hidden=false;state.textContent='PDF generado: '+bytes.byteLength+' bytes.';
}catch(e){state.textContent='Error: '+e.message;}}
document.getElementById('render').onclick=()=>generate(false);document.getElementById('many').onclick=()=>generate(true);
CimagrafTestFrame.mount(app).catch(e=>{state.textContent=e.message;});
</script></html>
