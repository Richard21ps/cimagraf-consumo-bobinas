name: Publicar calculadora Cimagraf

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar calculadora
        uses: actions/checkout@v4
      - name: Comprobar cálculos y registro
        run: node --test tests/*.test.cjs
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar sitio HTML
        uses: actions/upload-pages-artifact@v5
        with:
          path: .
          name: github-pages-${{ github.run_attempt }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url || steps.final.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - name: Esperar disponibilidad del artefacto
        if: steps.deployment.outcome == 'failure'
        run: sleep 15
      - name: Reintentar publicación
        if: steps.deployment.outcome == 'failure'
        id: retry
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - name: Esperar recuperación de Pages
        if: steps.retry.outcome == 'failure'
        run: sleep 30
      - name: Confirmar publicación
        if: steps.retry.outcome == 'failure'
        id: final
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
